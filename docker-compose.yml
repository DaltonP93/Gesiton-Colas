# Gestión de Colas — despliegue completo en un servidor
#   cp .env.example .env   (edite JWT_SECRET, PUBLIC_URL y credenciales)
#   docker compose up -d
#   → http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gc}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_colas}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gc} -d ${POSTGRES_DB:-gestion_colas}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: gestion-colas:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gc}:${POSTGRES_PASSWORD:-gc}@db:5432/${POSTGRES_DB:-gestion_colas}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      # Dentro del contenedor la app siempre escucha en 3000 y guarda los archivos en el volumen,
      # aunque .env defina PORT (puerto publicado en el servidor) o UPLOAD_DIR (instalación sin Docker).
      PORT: '3000'
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - uploads:/data/uploads
      # Copias de seguridad automáticas (Plataforma → Ajustes → Copias de seguridad).
      - backups:/data/backups

  # Almacenamiento S3 compatible opcional (docker compose --profile s3 up -d).
  # Configure STORAGE_DRIVER=s3, S3_ENDPOINT=http://minio:9000, S3_BUCKET, S3_ACCESS_KEY y S3_SECRET_KEY.
  minio:
    image: minio/minio:latest
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  db-data:
  uploads:
  backups:
  minio-data:
